<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出发！非看不可的世界博物馆</title>
<meta name="theme-color" content="#F7F5F0">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:#F7F5F0;color:#20242A;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  min-height:100vh;overflow-x:hidden;
}
.wrap{max-width:680px;margin:0 auto;padding:clamp(30px,7vw,54px) 20px 70px}
/* mast */
.mast{text-align:center;margin-bottom:6px}
.mast .en{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;letter-spacing:.35em;color:#B9B4A9;text-transform:uppercase}
.mast h1{font-size:clamp(27px,7.2vw,36px);font-weight:900;letter-spacing:.04em;margin:10px 0 4px;line-height:1.25}
.mast h1 .bang{color:#FF6B35}
.mast .sub{font-size:13px;color:#8B877D;letter-spacing:.14em;line-height:2}
.mast .sub b{color:#20242A}
.pbar{margin:22px auto 0;max-width:380px}
.pbar .pt{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.18em;color:#8B877D;margin-bottom:7px}
.pbar .pt b{color:#20242A}
.pbar .rail{height:8px;background:#E9E5DC;border-radius:99px;overflow:hidden}
.pbar .fill{height:100%;width:0%;background:#FF6B35;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
/* chips */
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:26px 0 8px}
.chip{border:1.5px solid #20242A;background:#fff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;letter-spacing:.08em;color:#20242A;cursor:pointer;font-family:inherit}
.chip.on{background:#20242A;color:#fff}
/* shelf */
.sec{margin-top:30px}
.sec-t{display:flex;align-items:baseline;gap:10px;margin:0 2px 14px}
.sec-t .st-zh{font-size:17px;font-weight:900;letter-spacing:.06em}
.sec-t .st-n{font-size:12px;color:#B9B4A9;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}}
/* 封面卡 */
.bk{position:relative;border-radius:6px 14px 14px 6px;overflow:hidden;cursor:pointer;
  background:linear-gradient(160deg,#3E444D 0%,#2A2E35 100%);
  aspect-ratio:3/4.15;box-shadow:0 10px 24px rgba(32,36,42,.16),inset 3px 0 0 rgba(255,255,255,.07);
  display:flex;flex-direction:column;transition:transform .25s}
.bk:active{transform:scale(.965)}
.bk::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:rgba(255,255,255,.09)}
.bk .brand{background:#FF6B35;color:#fff;font-size:8.5px;font-weight:800;letter-spacing:.14em;padding:6px 10px 6px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .no{position:absolute;top:34px;right:10px;font-family:Georgia,serif;font-style:italic;font-size:30px;color:rgba(255,255,255,.14);font-weight:700}
.bk .body{flex:1;padding:14px 13px 10px 16px;display:flex;flex-direction:column}
.bk .cc{font-size:10px;letter-spacing:.22em;color:#C8C2B4;font-weight:700}
.bk .nm{color:#fff;font-size:16.5px;font-weight:900;letter-spacing:.03em;line-height:1.35;margin-top:7px}
.bk .nm .vol{color:#FF9B6B;font-size:12px;font-weight:800;letter-spacing:.1em}
.bk .bt{margin-top:auto;padding-top:8px;border-top:1px solid rgba(255,255,255,.14);font-size:10.5px;color:#B6B0A3;letter-spacing:.05em;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk .star{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 46px 46px 0;border-color:transparent #FF6B35 transparent transparent}
.bk .star i{position:absolute;top:9px;right:-40px;color:#fff;font-size:10px;font-style:normal;font-weight:800;letter-spacing:.05em;transform:rotate(45deg);display:block;width:40px;text-align:center}
.bk.want{outline:2.5px solid #FF6B35;outline-offset:-2.5px}
/* sheet */
.mask{position:fixed;inset:0;background:rgba(20,22,26,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
.mask.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#FDFCFA;border-radius:22px 22px 0 0;
  max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);
  padding:0 0 40px}
.sheet.open{transform:translateY(0)}
.grab{width:44px;height:5px;border-radius:99px;background:#DDD8CD;margin:12px auto 0}
.sh-top{position:relative;background:linear-gradient(160deg,#3E444D 0%,#2A2E35 100%);color:#fff;padding:20px 24px 22px}
.sh-top .brand{display:inline-block;background:#FF6B35;color:#fff;font-size:9px;font-weight:800;letter-spacing:.16em;padding:5px 10px;border-radius:99px}
.sh-top .no{position:absolute;top:16px;right:20px;font-family:Georgia,serif;font-style:italic;font-size:44px;color:rgba(255,255,255,.13);font-weight:700}
.sh-top h2{font-size:23px;font-weight:900;letter-spacing:.03em;margin-top:12px;line-height:1.35}
.sh-top .loc{font-size:12px;color:#C8C2B4;letter-spacing:.12em;margin-top:6px}
.sh-top .one{font-size:13px;color:#E8E4DA;line-height:1.9;margin-top:12px;font-family:Georgia,'Songti SC',serif;font-style:italic}
.sh-body{padding:22px 24px 0}
.sec-h{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.sec-h .en{font-family:Georgia,serif;font-style:italic;font-size:12px;color:#B9B4A9;letter-spacing:.16em}
.sec-h .zh{font-size:15px;font-weight:900;letter-spacing:.08em}
.sec-h::after{content:'';flex:1;height:1px;background:#E9E5DC}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.fact{background:#fff;border:1px solid #E9E5DC;border-radius:10px;padding:10px 13px;font-size:11.5px;color:#5B5850;letter-spacing:.05em;line-height:1.6;flex:1;min-width:100px}
.fact b{display:block;color:#20242A;font-size:12.5px;font-weight:800;margin-bottom:2px}
.bao{list-style:none}
.bao li{background:#fff;border:1px solid #E9E5DC;border-radius:12px;padding:14px 15px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start}
.bao .bn{flex:none;width:26px;height:26px;border-radius:50%;background:#FF6B35;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}
.bao .bt b{display:block;font-size:14.5px;font-weight:800;letter-spacing:.02em}
.bao .bt span{display:block;font-size:12px;color:#8B877D;line-height:1.75;margin-top:4px}
.colu{background:#F3F0E8;border-radius:12px;padding:14px 16px;margin-bottom:9px}
.colu .ct{font-size:10.5px;font-weight:800;letter-spacing:.2em;color:#FF6B35;margin-bottom:6px}
.colu .cb{font-size:12.5px;color:#5B5850;line-height:1.85}
.act{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;border-radius:999px;padding:14px 0;font-size:14.5px;font-weight:800;letter-spacing:.1em;cursor:pointer;font-family:inherit;border:1.5px solid #20242A;transition:.2s}
.btn.ghost{background:#fff;color:#20242A}
.btn.ghost.on{background:#FFE9DD;border-color:#FF6B35;color:#C9420A}
.btn.solid{background:#20242A;color:#fff}
.btn.solid.on{background:#FF6B35;border-color:#FF6B35}
.close{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:28px;border:0;background:transparent;cursor:pointer;z-index:2}
.foot{text-align:center;margin-top:52px;font-size:11px;color:#B9B4A9;letter-spacing:.15em;line-height:2.2}
.foot b{color:#8B877D}
</style>
</head>

const CONT = ['全部','亚洲','欧洲','非洲','北美洲','南美洲'];
const KEY='museum-books-v1';
let st = JSON.parse(localStorage.getItem(KEY) || '{}');
st.want = st.want || []; st.read = st.read || [];
function save(){ localStorage.setItem(KEY, JSON.stringify(st)); }

const shelf=document.getElementById('shelf'), chips=document.getElementById('chips');
let curC='全部';
function grp(){
  const order=['亚洲','欧洲','非洲','北美洲','南美洲'];
  return order.map(c=>({c, items:B.filter(b=>b.continent===c)})).filter(g=>g.items.length);
}
function chipUI(){
  chips.innerHTML = CONT.map(c=>'<button class="chip'+(c===curC?' on':'')+'" data-c="'+c+'">'+c+'</button>').join('');
  chips.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{curC=b.dataset.c;chipUI();render();}));
}
function render(){
  const gs = grp().filter(g=>curC==='全部'||g.c===curC);
  shelf.innerHTML = gs.map(g=>
    '<div class="sec"><div class="sec-t"><span class="st-zh">'+g.c+'</span><span class="st-n">'+g.items.length+' 册</span></div>'+
    '<div class="grid">'+g.items.map(b=>
      '<div class="bk'+(st.want.includes(b.no)?' want':'')+'" data-no="'+b.no+'">'+
      (st.read.includes(b.no)?'<span class="star"><i>已读</i></span>':'')+
      '<div class="brand">出发！非看不可的世界博物馆</div>'+
      '<div class="no">'+b.no+'</div>'+
      '<div class="body"><div class="cc">'+b.country+' · '+b.type+'</div>'+
      '<div class="nm">'+b.name+(b.vol?' <span class="vol">Vol.'+b.vol+'</span>':'')+'</div>'+
      '<div class="bt">'+b.bao[0][0]+'</div></div></div>').join('')+'</div></div>'
  ).join('') +
  '<div class="sec"><div class="sec-t"><span class="st-zh">附赠</span><span class="st-n">1 本</span></div><div class="grid">'+
  '<div class="bk" style="opacity:.92" id="gcCard"><div class="brand" style="background:#8B877D">赠 · 世界博物馆打卡本</div><div class="no">&#10003;</div><div class="body"><div class="cc">边逛边涂 · 边学边画</div><div class="nm">世界博物馆<br>打卡本</div><div class="bt">读完一册来盖一枚章——你的进度就是你的足迹地图</div></div></div></div></div>';
  shelf.querySelectorAll('.bk[data-no]').forEach(el=>el.addEventListener('click',()=>openSheet(+el.dataset.no)));
  document.getElementById('gcCard').addEventListener('click',()=>{
    toast('已读 '+st.read.length+' 册 · 想读 '+st.want.length+' 册 —— 读完 27 册，你就云逛完了 24 座馆、16 个国家');
  });
  progress();
}
function progress(){
  document.getElementById('pRead').textContent=st.read.length;
  document.getElementById('pWant').textContent=st.want.length;
  document.getElementById('pFill').style.width=(st.read.length/27*100)+'%';
}
function toast(t){
  let el=document.getElementById('tt');
  if(!el){el=document.createElement('div');el.id='tt';el.style.cssText='position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#20242A;color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;letter-spacing:.05em;z-index:99;transition:opacity .3s;pointer-events:none;max-width:80vw;text-align:center';document.body.appendChild(el);}
  el.textContent=t;el.style.opacity='1';
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity='0',2200);
}
// sheet
const mask=document.getElementById('mask'), sheet=document.getElementById('sheet'), sb=document.getElementById('sheetBody');
function openSheet(no){
  const b=B.find(x=>x.no===no);
  sb.innerHTML =
  '<div class="sh-top"><span class="brand">出发！非看不可的世界博物馆</span><span class="no">'+b.no+'</span>'+
  '<h2>'+b.name+(b.vol?' <span style="color:#FF9B6B;font-size:15px">Vol.'+b.vol+'</span>':'')+'</h2>'+
  '<div class="loc">'+b.en+' · '+b.city+' · '+b.country+' · '+b.year+' 年建馆</div>'+
  '<div class="one">'+b.one+'</div></div>'+
  '<div class="sh-body">'+
  '<div class="sec-h"><span class="en">Facts</span><span class="zh">博物馆档案</span></div>'+
  '<div class="facts"><div class="fact"><b>'+b.type+'</b>馆型</div><div class="fact"><b>'+b.country+'</b>国家 · '+b.city+'</div><div class="fact"><b>'+b.year+'</b>建馆年份</div></div>'+
  '<div class="sec-h"><span class="en">Must-see</span><span class="zh">镇馆三宝</span></div>'+
  '<ul class="bao">'+b.bao.map((x,i)=>'<li><span class="bn">'+(i+1)+'</span><span class="bt"><b>'+x[0]+'</b><span>'+x[1]+'</span></span></li>').join('')+'</ul>'+
  '<div class="sec-h"><span class="en">Inside the book</span><span class="zh">书里还有</span></div>'+
  '<div class="colu"><div class="ct">'+b.colu[0]+'</div><div class="cb">'+b.colu[1]+'</div></div>'+
  '<div class="act">'+
  '<button class="btn ghost'+(st.want.includes(no)?' on':'')+'" id="bWant">想读'+(st.want.includes(no)?' ✓':'')+'</button>'+
  '<button class="btn solid'+(st.read.includes(no)?' on':'')+'" id="bRead">读过'+(st.read.includes(no)?' ✓':'')+'</button></div></div>';
  document.getElementById('bWant').addEventListener('click',()=>{
    const i=st.want.indexOf(no);
    if(i>=0){st.want.splice(i,1);toast('已移出想读');}
    else{st.want.push(no);toast('加入想读 —— 出发前的书签');}
    save();render();openSheet(no);
  });
  document.getElementById('bRead').addEventListener('click',()=>{
    const i=st.read.indexOf(no);
    if(i>=0){st.read.splice(i,1);toast('已移出已读');}
    else{st.read.push(no);toast(st.read.length===27?'🏆 27 册全部读完！你云逛完了 24 座馆':'读过 ✓ —— 第 '+st.read.length+' / 27 册');}
    save();render();openSheet(no);
  });
  mask.classList.add('open'); sheet.classList.add('open');
  document.body.style.overflow='hidden'; sheet.scrollTop=0;
}
function closeSheet(){
  mask.classList.remove('open'); sheet.classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('closeBtn').addEventListener('click',closeSheet);
mask.addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
chipUI(); render();
</script>
